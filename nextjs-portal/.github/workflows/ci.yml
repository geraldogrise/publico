name: CI - nextjs-portal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-dummy-secret-please-change
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nextjs-portal .
